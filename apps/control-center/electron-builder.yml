appId: io.github.codex-router.control-center
productName: Codex Router
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
asar: true
electronFuses:
  # The packaged Electron executable intentionally runs the trusted installed
  # router entrypoints in Node mode; command-runner.mjs depends on this fuse.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
extraResources:
  - from: assets/icon.png
    to: icon.png
  - from: ../../src/spawnable-command.mjs
    to: src/spawnable-command.mjs
  - from: ../../src/chatgpt-login-lease.mjs
    to: src/chatgpt-login-lease.mjs
  - from: ../../src/file-security.mjs
    to: src/file-security.mjs
  - from: ../../src/path-security.mjs
    to: src/path-security.mjs
  - from: ../../src/process-identity.mjs
    to: src/process-identity.mjs
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.png
  target: [dmg, zip]
linux:
  icon: assets/icon.png
  category: Development
  executableName: codex-router-control-center
  target: [AppImage]
win:
  icon: assets/icon.ico
  target: [nsis]
